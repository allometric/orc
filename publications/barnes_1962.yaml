publication:
  key: barnes_1962
  bibtype: techreport
  title: "Yield of even-aged stands of western hemlock"
  author: "Barnes, George H"
  number: 1273
  year: 1962
  institution: "Department of Agriculture, Forest Service"
  descriptors:
    country: US
    region: [US-OR, US-WA]

models:
  - name: hstix50
    type: fixed_effects
    response: { hstix50: "ft" }
    covariates:
      atb: "year"
      hst: "ft"
    taxa:
      - family: Pinaceae
        genus: Tsuga
        species: heterophylla
    parameters:
      a: 22.6
      b: 0.014482
      c: 0.001162
    prediction_function: "4.5 + a * exp((b - c * log(atb)) * (hst - 4.5))"